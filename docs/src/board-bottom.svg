<rect x="200" y="1030" width="1616" height="190" rx="10" fill="rgba(0,0,0,0.82)" stroke="#ff3b30" stroke-width="3"/>
<text x="224" y="1078" font-size="28" font-weight="bold" fill="#ff3b30">UART_Rx (R↑T)</text>
<text x="224" y="1120" font-size="28" font-weight="normal" fill="#fff">Open at the MCU (R13 removed) or high: RS-485 driver off, receiver on, SCS data on UART_Tx.</text>
<text x="224" y="1162" font-size="28" font-weight="normal" fill="#fff">Low: the tap stops receiving; the driver pushes at most 0.1 mA into the SCS bus (a few mV).</text>
<text x="224" y="1204" font-size="28" font-weight="normal" fill="#fff">With R13 still fitted, an open UART_Rx floats at ~1.65 V and the tap is unreliable: drive it high.</text>
