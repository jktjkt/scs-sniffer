# SCS bus tap: merge into the device config (needs logger:). Copy scs_decoder.h, scs_protocol.h
# and scs_esphome.h next to the config.
#   GPIO54 <- Grove T↓R (UART_Tx, module output): SCS pulses, active low
#   GPIO53 -> Grove R↑T (UART_Rx, module input): held high = receiver on
# Every frame is logged at DEBUG ("frame A8 91 03 60 08 FA A3: ring flat 03") and handed to the
# lambda below as hex and as text. Malformed captures, stray bytes and glitches are logged at WARN
# with the raw capture.

esphome:
  includes:
    - scs_decoder.h
    - scs_protocol.h
    - scs_esphome.h

switch:
  - platform: gpio
    id: scs_rx_enable
    pin: GPIO53
    restore_mode: ALWAYS_ON
    internal: true

remote_receiver:
  id: scs_rx
  pin:
    number: GPIO54
    inverted: true  # tap output is active low; marks = SCS pulses
    mode:
      input: true
      pullup: true  # on-board pull-up R11 is only 100 k
  filter: 2us  # the decoder rejects glitches < 8 us itself
  idle: 2ms  # longest gap inside a frame is ~0.8 ms
  use_dma: true
  rmt_symbols: 512
  receive_symbols: 512
  on_raw:
    then:
      - lambda: |-
          scs_esphome::feed(x, [](const std::string &frame, const std::string &message) {
            // example: put your own reaction to a frame here
            ESP_LOGI("scs", "%s (%s)", message.c_str(), frame.c_str());
          });
